<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile - PT Trinity Berkah Mandiri</title>
    <link rel="icon" type="image/png" href="../logo.png">
    
    <!-- Fonts: Montserrat & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Konfigurasi Warna -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0a192f', 800: '#112240' },
                        gold: { 400: '#D4AF37', 500: '#C5A028' },
                        slate: { white: '#e6f1ff' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        header: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0a192f; overflow: hidden; }
        
        /* Loading Animation */
        .loader {
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-left-color: #D4AF37;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Iframe Container Full */
        .iframe-wrapper {
            position: absolute;
            top: 70px; /* Space for header */
            left: 0;
            width: 100%;
            height: calc(100% - 70px);
            z-index: 10;
        }

        /* Glass Header */
        .glass-header {
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        /* Panah Animasi */
        .arrow-guide {
            position: absolute;
            top: 55%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.2);
            background: rgba(10, 25, 47, 0.3);
            padding: 15px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.1);
            pointer-events: none; /* KLIK TEMBUS KE CANVA */
            z-index: 20;
            transition: all 0.3s;
        }

        .arrow-left { left: 20px; animation: bounceLeft 2.5s infinite; }
        .arrow-right { right: 20px; animation: bounceRight 2.5s infinite; }

        @keyframes bounceLeft {
            0%, 100% { transform: translate(0, -50%); opacity: 0.3; }
            50% { transform: translate(-10px, -50%); opacity: 0.8; border-color: #D4AF37; color: #D4AF37; }
        }
        @keyframes bounceRight {
            0%, 100% { transform: translate(0, -50%); opacity: 0.3; }
            50% { transform: translate(10px, -50%); opacity: 0.8; border-color: #D4AF37; color: #D4AF37; }
        }

        @media (max-width: 768px) {
            .arrow-guide { font-size: 1.5rem; padding: 10px; }
            .arrow-left { left: 10px; }
            .arrow-right { right: 10px; }
        }
    </style>
</head>
<body class="antialiased">

    <!-- Loading Screen -->
    <div id="loader" class="fixed inset-0 z-0 flex flex-col items-center justify-center bg-navy-900">
        <div class="loader mb-4"></div>
        <p class="text-gold-400 font-header text-xs md:text-sm tracking-[0.3em] animate-pulse">MEMUAT TRINITY PROFILE...</p>
    </div>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full h-[70px] z-50 glass-header flex items-center justify-between px-6 md:px-12">

        <!-- Kiri: Logo + back -->
        <a href="/" class="flex items-center gap-3 group">
            <img src="../logo.png" alt="Trinity Logo" class="h-9 w-auto object-contain drop-shadow-[0_0_8px_rgba(212,175,55,0.3)] transition-transform duration-300 group-hover:scale-105">
            <div class="hidden md:flex flex-col">
                <span class="font-header font-bold text-base text-white tracking-widest leading-none">TRINITY</span>
                <span class="font-header font-medium text-[10px] text-gold-400 tracking-[0.22em] leading-none mt-0.5">BERKAH MANDIRI</span>
            </div>
        </a>

        <!-- Tengah: nav links -->
        <ul class="hidden md:flex gap-8 items-center absolute left-1/2 -translate-x-1/2">
            <li><a href="/"        class="text-xs font-semibold text-gray-300 hover:text-gold-400 transition duration-300 tracking-widest uppercase">Beranda</a></li>
            <li><a href="/#divisi" class="text-xs font-semibold text-gray-300 hover:text-gold-400 transition duration-300 tracking-widest uppercase">Divisi</a></li>
            <li><a href="/contact" class="text-xs font-semibold text-gray-300 hover:text-gold-400 transition duration-300 tracking-widest uppercase">Kontak</a></li>
        </ul>

        <!-- Kanan: WA button -->
        <a href="https://wa.me/6281317819567" target="_blank"
           class="hidden md:flex items-center gap-2 border border-gold-400 text-gold-400 px-5 py-2 rounded-sm text-xs font-bold hover:bg-gold-400 hover:text-navy-900 transition duration-300 tracking-wider uppercase">
            <i class="fab fa-whatsapp text-sm"></i> Hubungi
        </a>
        <a href="https://wa.me/6281317819567" target="_blank" class="md:hidden text-gold-400 text-2xl">
            <i class="fab fa-whatsapp"></i>
        </a>

    </nav>

    <!-- Visual Cues (Panah) -->
    <div class="arrow-guide arrow-left">
        <i class="fas fa-chevron-left"></i>
    </div>
    <div class="arrow-guide arrow-right">
        <i class="fas fa-chevron-right"></i>
    </div>

    <!-- Hint Text -->
    <div id="hint-text" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40 bg-navy-900/90 backdrop-blur px-6 py-2 rounded-full border border-gold-400/30 text-slate-white text-xs tracking-wider transition-opacity duration-1000 delay-3000 shadow-xl">
        <i class="fas fa-hand-pointer text-gold-400 mr-2 animate-bounce"></i> Geser layar untuk halaman berikutnya
    </div>

    <!-- Canva Embed -->
    <div class="iframe-wrapper bg-navy-900">
        <iframe 
            loading="lazy"
            class="w-full h-full border-0"
            src="https://www.canva.com/design/DAHFgskoQJM/VnqrpwkG6BJXE47XBvgdGQ/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen"
            onload="document.getElementById('loader').style.display='none'">
        </iframe>
    </div>

    <script>
        // Hapus hint text setelah 5 detik
        setTimeout(() => {
            const hint = document.getElementById('hint-text');
            if(hint) {
                hint.style.opacity = '0';
                setTimeout(() => hint.remove(), 1000);
            }
        }, 5000);
    </script>


    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/6281317819567" target="_blank" id="wa-float" title="Chat via WhatsApp" style="position:fixed;bottom:28px;right:28px;z-index:9999;width:58px;height:58px;background:linear-gradient(135deg,#25D366,#128C7E);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(37,211,102,0.45);text-decoration:none;animation:wa-bounce 2.8s ease-in-out infinite;"><i class="fab fa-whatsapp" style="color:white;font-size:30px;line-height:1;"></i><span style="position:absolute;top:0px;right:0px;width:16px;height:16px;background:#D4AF37;border-radius:50%;border:2px solid white;animation:wa-pulse 2s ease-in-out infinite;"></span></a>
    <style>@keyframes wa-bounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-9px) scale(1.05);}}@keyframes wa-pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:0.5;}}</style>
</body>

</html>
